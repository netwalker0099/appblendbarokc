[package]
name = "blendbar-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal", "migrate", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
# Square webhook signatures are base64-encoded (the old integration used hex).
base64 = "0.22"
argon2 = "0.5"
totp-rs = { version = "5", features = ["gen_secret", "otpauth", "qr"] }
qrcode = "0.14"
# Google Workspace SMTP relay. rustls to match the rest of the stack (no openssl).
# RS256 JWT signing for the Gmail service-account assertion (ring, not openssl).
jsonwebtoken = "9"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"] }
