<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thank you — The Blend Bar</title>
    <meta name="description" content="Order confirmed — The Blend Bar." />
    <!-- Order confirmations should never surface in search results. -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/webp" href="/assets/img1.webp" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/" aria-label="The Blend Bar home">
          <img src="/assets/img1.webp" alt="The Blend Bar monogram" />
          <span class="name">The Blend Bar</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <div class="actions"><a class="btn ghost" href="/">Home</a></div>
        </nav>
      </div>
    </header>

    <main class="portal-wrap">
      <div class="share-card">
        <img class="share-mark" src="/assets/img1.webp" alt="" />
        <p class="eyebrow">Order confirmed</p>
        <h1>Thank you</h1>
        <p>Payment received. Square has emailed your receipt.</p>
        <!-- These blends are hand-made by staff, not picked off a shelf. Saying
             so here prevents the "where's my tracking number?" email. -->
        <p class="muted">
          Blends are mixed by hand, so yours isn&rsquo;t off the shelf. We&rsquo;ll
          email you when it&rsquo;s ready to collect.
        </p>
        <a class="btn solid" href="/portal">View your blends</a>
        <p class="muted share-foot">
          Questions? Message
          <a href="https://www.instagram.com/theblendbar.okc" rel="noopener">@theblendbar.okc</a>.
        </p>
      </div>
    </main>
  </body>
</html>
